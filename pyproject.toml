[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "text-extractor-lightweight"
version = "0.2.0"
description = "Lightweight MCP server + CLI for extracting text from PDFs and images. Agent-first, zero-config."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "debar" }]
keywords = ["mcp", "pdf", "ocr", "text-extraction", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

dependencies = [
    "pypdf>=4.0",
    "mcp[cli]>=1.0",
    "click>=8.0",
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
fast = ["pymupdf>=1.24"]
ocr = ["pytesseract>=0.3", "Pillow>=10.0", "pdf2image>=1.16"]
docling = ["docling>=2.40.0"]
all = ["pymupdf>=1.24", "pytesseract>=0.3", "Pillow>=10.0", "pdf2image>=1.16", "docling>=2.40.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
text-extractor = "text_extractor.cli:main"
text-extractor-mcp = "text_extractor.mcp_server:main"

[project.entry-points."mcp.servers"]
text-extractor = "text_extractor.mcp_server:mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/text_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
